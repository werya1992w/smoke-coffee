name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A fixed debug key keeps every build signed the same way, so a new APK
      # installs over the old one and keeps its data.
      - name: Use the fixed debug signing key
        run: |
          mkdir -p ~/.android
          cp signing/debug.keystore ~/.android/debug.keystore

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Set the version number from the run number
        run: |
          sed -i "s/versionCode [0-9][0-9]*/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle
          grep -nE "versionCode|versionName" android/app/build.gradle

      - name: Generate app icons
        continue-on-error: true
        run: npx --yes @capacitor/assets generate --android --iconBackgroundColor '#14171A' --iconBackgroundColorDark '#14171A'

      - name: Sync web files
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: smoke-coffee-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
